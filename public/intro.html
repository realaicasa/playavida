<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6fbf9;--fg:#08303a;--mut:#4a6b70;--card:#fff;--line:#d3e5e2;--deep:#06323a;--sun:#ffc857;--wave:25,181,176;color-scheme:light dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061a1f;--fg:#e6f4f1;--mut:#9dbcb9;--card:#0c2a30;--line:#1b4249;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#061a1f;--fg:#e6f4f1;--mut:#9dbcb9;--card:#0c2a30;--line:#1b4249;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1.05rem/1.6 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.08;margin:0}
h2{font-size:clamp(1.8rem,4.5vw,2.8rem);font-weight:800;letter-spacing:-.02em}
p{margin:0}.w{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:76px 0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .w{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.logo{font:800 1.25rem Fraunces,serif;color:var(--p); display: flex; align-items: center; gap: 8px;}
.logo img{width:48px;height:48px;border-radius:8px; object-fit: contain;}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:none;color:var(--fg);padding:6px 12px;font:700 .85rem inherit;cursor:pointer}
.seg [aria-pressed=true]{background:var(--p);color:#04252a}
.btn{display:inline-block;border:0;border-radius:99px;padding:13px 26px;font:700 1rem "DM Sans",sans-serif;background:var(--a);color:#2a0d05;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgb(0 0 0/.2)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg);padding:6px 14px;font-size:.85rem}
.sw{display:flex;align-items:center;gap:8px;font-size:.85rem;cursor:pointer}
.sw input{position:absolute;opacity:0}.sw i{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:.25s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s}
.sw input:checked+i{background:var(--p)}.sw input:checked+i:after{left:19px}.sw input:focus-visible+i{outline:3px solid var(--sun)}
/* hero */
.hero{position:relative;background:linear-gradient(180deg,#06323a 0%,#0b5560 70%,#118a93 100%);color:#f2fbf9;padding:90px 0 190px;overflow:hidden}
.hero .w{position:relative;z-index:2}
.pill{display:inline-block;background:#ffffff1f;border:1px solid #ffffff30;border-radius:99px;padding:5px 14px;font-size:.9rem;margin-bottom:22px}
.hero h1{font-size:clamp(2.6rem,8vw,5.6rem);font-weight:800;letter-spacing:-.03em;max-width:12ch}
.hero .sub{max-width:52ch;margin:22px 0 32px;font-size:1.2rem;color:#d4ece8}
.hero .acts{display:flex;gap:14px;flex-wrap:wrap}
.hero .btn.ghost{color:#f2fbf9;border-color:#ffffff55;padding:13px 26px;font-size:1rem}
.sun{position:absolute;right:-90px;top:-90px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,var(--sun),var(--a) 55%,transparent 72%);opacity:.85;animation:rise 1.6s .1s both ease-out}
.tide{position:absolute;left:0;right:0;bottom:-1px;height:120px;background-repeat:repeat-x;background-size:1200px 100%;animation:tide 18s linear infinite;z-index:1}
.tide.t2{height:90px;opacity:.55;animation-duration:11s;animation-direction:reverse;bottom:6px}
.tide.t3{height:70px;opacity:.35;animation-duration:7s;bottom:14px}
.chip{position:absolute;z-index:2;background:#ffffff22;backdrop-filter:blur(8px);border:1px solid #ffffff3a;border-radius:99px;padding:8px 16px;font-size:.95rem;animation:bob 6s ease-in-out infinite}
.hero h1,.hero .pill,.hero .sub,.hero .acts{animation:up .9s both cubic-bezier(.2,.7,.2,1)}
.hero .pill{animation-delay:.1s}.hero h1{animation-delay:.25s}.hero .sub{animation-delay:.45s}.hero .acts{animation-delay:.6s}
@keyframes up{from{opacity:0;transform:translateY(28px)}}
@keyframes rise{from{transform:translateY(80px);opacity:0}}
@keyframes tide{to{background-position-x:1200px}}
@keyframes bob{50%{transform:translateY(-14px)}}
/* answer + marquee */
.ans{font:600 clamp(1.25rem,2.6vw,1.7rem)/1.4 Fraunces,serif;max-width:46ch;margin-top:-10px}
.mq{overflow:hidden;border-block:1px solid var(--line);padding:16px 0;background:var(--card)}
.mq div{display:flex;gap:38px;width:max-content;animation:mq 38s linear infinite}
.mq span{white-space:nowrap;font-weight:500}.mq:hover div{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;transition:transform .25s}
.card:hover{transform:translateY(-4px)}.card h3{font-size:1.4rem;margin:8px 0 8px}.card p{color:var(--mut)}
.em{font-size:2rem}
.card:nth-child(2){border-radius:22px 60px 22px 22px}.card:nth-child(3){border-radius:60px 22px 22px 22px}
.steps{display:grid;gap:0;margin-top:34px;counter-reset:s}
.step{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:22px 0;border-top:1px solid var(--line)}
.step:before{counter-increment:s;content:counter(s);font:800 2.4rem Fraunces,serif;color:var(--a)}
.step h3{font-size:1.3rem}.step p{color:var(--mut);max-width:60ch}
/* magazine */
.mag{background:var(--deep);color:#eaf7f4;border-radius:36px;padding:46px 28px;display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center;overflow:hidden}
.mag p{color:#bcdcd8;margin-top:14px;max-width:44ch}
.cover{background:linear-gradient(145deg,var(--p),var(--a));border-radius:22px;padding:26px;color:#1b0b05;transform:rotate(3deg);transition:transform .5s;box-shadow:0 20px 50px #0006}
.cover:hover{transform:rotate(0) scale(1.03)}
.cover b{font:800 1.5rem Fraunces,serif;display:block;margin:10px 0}
.lbl{display:inline-block;background:#1b0b05;color:#fff;border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:700}
@media(max-width:760px){.mag{grid-template-columns:1fr}.chip{display:none}.hero{padding-top:56px}}
/* faq */
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{cursor:pointer;font:600 1.2rem Fraunces,serif;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}summary:after{content:"+";font-size:1.6rem;color:var(--a);transition:transform .3s}
details[open] summary:after{transform:rotate(45deg)}details p{color:var(--mut);margin-top:10px;max-width:64ch;animation:up .4s both}
.cta{text-align:center;padding:84px 0}.cta h2{max-width:18ch;margin:0 auto 26px}
.foot{background:var(--deep);color:#cfe6e2;padding:20px 0 40px}
.foot .bar2{border-bottom:1px solid #ffffff22;padding:16px 0;margin-bottom:26px}
.foot .sw,.foot .seg button{color:#e8f6f3}.foot .btn.ghost{color:#e8f6f3;border-color:#ffffff40}.foot .seg{border-color:#ffffff40}
.foot a,.foot button.l{color:#cfe6e2;background:none;border:0;font:inherit;text-decoration:underline;cursor:pointer;margin-right:18px;padding:0}
.foot small{display:block;margin-top:16px;opacity:.7}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--fg);max-width:620px;width:calc(100% - 32px);padding:24px}
dialog::backdrop{background:#000a}dialog .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
dialog .tabs button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:99px;padding:6px 14px;cursor:pointer}
dialog .tabs [aria-pressed=true]{background:var(--p);color:#04252a}
.draft{color:var(--a);font-weight:700;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--deep);color:#fff;padding:12px 20px;border-radius:14px;opacity:0;transition:.3s;z-index:50;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div><div class="toast" id="toast" role="status"></div><dialog id="dlg"></dialog>

const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let lang=ls.get("lang")||((navigator.language||"en").startsWith("es")?"es":"en"),skip=ls.get("skipIntro")==="true",dp,tab="privacy";

const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(x=>io.observe(x));jsonld()}
function jsonld(){document.getElementById("ld")?.remove();const s=document.createElement("script");s.id="ld";s.type="application/ld+json";
s.textContent=JSON.stringify({"@context":"https://schema.org","@graph":[{"@type":"Organization",name:S.brand.name,description:f(S.seo.desc),areaServed:t(S.geo.area)},{"@type":"WebSite",name:S.brand.name,inLanguage:lang},{"@type":"FAQPage",mainEntity:S.faq.map(x=>({"@type":"Question",name:f(x.q),acceptedAnswer:{"@type":"Answer",text:f(x.a)}}))}]});document.head.appendChild(s)}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove("on"),4200)}
function legal(){const L=S.legal,d=L.docs[tab];$("#dlg").innerHTML=`<h2 style="font-size:1.5rem">${t(U.rights)}</h2><div class="tabs">${Object.keys(L.docs).map(k=>`<button data-open="${k}" aria-pressed="${k==tab}">${t(L.docs[k].t)}</button>`).join("")}</div><h3>${t(d.t)}</h3><p style="margin:8px 0">${t(d.b)}</p>${tab=="rights"?`<p><em>${L.contact||t(U.need)}</em></p>`:""}<p class="draft">${t(U.draft)} · ${t(U.ver)} ${L.version}</p><p style="margin-top:16px"><button class="btn" data-close>${t(U.close)}</button></p>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-l],[data-install],[data-open],[data-again],[data-close]");if(!b)return;
if(b.dataset.l){lang=b.dataset.l;ls.set("lang",lang);const y=scrollY;render();scrollTo(0,y);if($("#dlg").open)legal()}
else if(b.hasAttribute("data-install")){if(dp){dp.prompt();dp=null}else toast(t(U.ios))}
else if(b.dataset.open){tab=b.dataset.open;legal();if(!$("#dlg").open)$("#dlg").showModal()}
else if(b.hasAttribute("data-again")){skip=false;ls.set("skipIntro",null);document.querySelectorAll("[data-skip]").forEach(x=>x.checked=false);toast(t(U.reset))}
else if(b.hasAttribute("data-close"))$("#dlg").close()});
document.addEventListener("change",e=>{if(e.target.matches("[data-skip]")){skip=e.target.checked;ls.set("skipIntro",skip?"true":null);document.querySelectorAll("[data-skip]").forEach(x=>x.checked=skip);toast(t(skip?U.saved:U.reset))}});
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e});
render();
</script>
</body>
</html>
